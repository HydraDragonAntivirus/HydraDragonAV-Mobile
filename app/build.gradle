import java.security.KeyStore
import java.security.MessageDigest
import com.android.build.api.variant.AndroidComponentsExtension
import com.android.build.api.variant.BuildConfigField

plugins {
    id 'com.android.application'
}

// Code-integrity check: hash the SIGNING CERTIFICATE this variant is about to
// be signed with (from its own signingConfig's keystore), baked in as
// BuildConfig.EXPECTED_SIGNATURE_SHA256 via buildConfigField below. At
// runtime IntegrityCheck compares this constant against the APK's ACTUAL
// signing cert (read from PackageManager) — see IntegrityCheck.java. Since
// the constant is computed from the SAME keystore that ends up signing the
// build, the two always match for an untouched build; they only diverge if
// someone decompiles/modifies the code and re-signs the APK with a different
// key (impossible to avoid re-signing — Android requires a valid signature to
// install at all). "UNAVAILABLE" (keystore unreadable at build time, e.g. no
// signing configured yet) disables the runtime check rather than blocking a
// legitimate build.
def signingCertSha256(config) {
    if (config == null || config.storeFile == null || !config.storeFile.exists()) return "UNAVAILABLE"
    for (String type : [config.storeType, "PKCS12", "JKS"]) {
        if (type == null) continue
        try {
            KeyStore ks = KeyStore.getInstance(type)
            config.storeFile.withInputStream { is -> ks.load(is, config.storePassword?.toCharArray()) }
            def cert = ks.getCertificate(config.keyAlias)
            if (cert == null) continue
            byte[] digest = MessageDigest.getInstance("SHA-256").digest(cert.getEncoded())
            return digest.collect { String.format('%02x', it) }.join('')
        } catch (Exception ignored) { /* try next keystore type */ }
    }
    return "UNAVAILABLE"
}

android {
    namespace 'com.hydradragon.antivirus'
    compileSdk 37

    defaultConfig {
        applicationId "com.hydradragon.antivirus"
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName "1.1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '*.proto']
        }
    }
}

// Hash the debug signing cert from the DSL config (variant API doesn't expose keystore details)
def debugSigningConfig = android.signingConfigs.findByName('debug')
def expectedSignatureSha256 = signingCertSha256(debugSigningConfig)

def ace = project.extensions.getByType(AndroidComponentsExtension)
ace.onVariants(ace.selector().all()) { variant ->
    variant.buildConfigFields.put("EXPECTED_SIGNATURE_SHA256",
        new BuildConfigField("String", "\"${expectedSignatureSha256}\"", "SHA-256 of signing cert"))
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'

    implementation "com.google.guava:guava:33.6.0-android"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'
    implementation 'androidx.lifecycle:lifecycle-service:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    // TensorFlow Lite removed: AIEngine is a pure-Java heuristic and the real ML
    // is the Rust apk_model.bin — nothing referenced org.tensorflow. Dropping it
    // also removes the unaligned TFLite native libs that tripped the Android 15
    // 16 KB page-size check, and shrinks the APK.
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    // On-device OCR for Zero Trust screen-capture scanning (ScreenCaptureService):
    // recognizes text from periodic MediaProjection frames, fed to the native
    // hydradragon.screen_text YARA-X module. Latin-script model only (no
    // dependency on Google Play Services beyond the base ML Kit runtime).
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
