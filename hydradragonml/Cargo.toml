[package]
name = "hydradragonml"
version = "0.3.0"
edition = "2024"
description = "HydraDragon ML inference engine: Burn-based malware/benign binary classifier."
license = "GPL-2.0-or-later"

[dependencies]
ripzip = "0.1"
flate2 = "1"
walkdir = "2"
serde_json = "1"
burn = { version = "0.21", default-features = false, features = ["ndarray", "train", "autodiff"] }
burn-autodiff = "0.21"
burn-train = "0.21"
burn-dataset = "0.21"
tempfile = "3"

[lib]
name = "hydradragonml"
path = "src/lib.rs"

[[bin]]
name = "hydradragonml-scan"
path = "src/main.rs"

[[bin]]
name = "hydradragonml-train"
path = "src/bin/train.rs"

[[bin]]
name = "hydradragonml-build-vocab"
path = "src/bin/build_vocab.rs"
