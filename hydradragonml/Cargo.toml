[package]
name = "hydradragonml"
version = "0.2.0"
edition = "2021"
description = "HydraDragon ML inference engine: tract-based ONNX malware/benign binary classifier."
license = "GPL-2.0-or-later"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tract-onnx = "0.21"
walkdir = "2"
md-5 = "0.11"
hydradragonxorfilter = { path = "../hydradragonxorfilter" }
rusqlite = { version = "0.40", features = ["bundled"] }

[lib]
name = "hydradragonml"
path = "src/lib.rs"

[[bin]]
name = "hydradragonml-scan"
path = "src/main.rs"
