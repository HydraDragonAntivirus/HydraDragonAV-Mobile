[package]
name = "hydradragonml"
version = "0.2.0"
edition = "2024"
description = "HydraDragon ML inference engine: tract-based ONNX malware/benign binary classifier."
license = "GPL-2.0-or-later"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
tract-onnx = "0.21"
walkdir = "2"
serde_json = "1"

[lib]
name = "hydradragonml"
path = "src/lib.rs"

[[bin]]
name = "hydradragonml-scan"
path = "src/main.rs"

[[bin]]
name = "debug-features"
path = "src/bin/debug_features.rs"
