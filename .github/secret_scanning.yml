# Exclude converted Suricata rules from secret scanning.
# emerging-all.yar contains hex-encoded network payload patterns from
# Emerging Threats rules (49k+ signatures). The hex bytes coincidentally
# match secret scanning patterns but are not actual secrets.
paths-ignore:
  - "yara-x/emerging-all.yar"
  - "yara-x/emerging-all.y*"
  - "convert/emerging-all.rules.txt"
  - "convert/*.txt"
  - "app/**/DnsVpnService.java"
