name: YARA-X Validate

on:
  push:
    paths:
      - 'yara-x/**/*.yar'
      - 'yara-x/**/*.yarx'
      - '.github/workflows/yara-x-validate.yml'
  pull_request:
    paths:
      - 'yara-x/**/*.yar'
      - 'yara-x/**/*.yarx'
      - '.github/workflows/yara-x-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install yara-x
        run: cargo install yara-x

      - name: Validate YARA-X rules
        run: |
          for f in $(find yara-x -name '*.yar' -o -name '*.yarx'); do
            echo "Validating: $f"
            yara-x check "$f" || exit 1
          done
