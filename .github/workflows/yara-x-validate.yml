name: YARA-X Validate

on:
  push:
    paths:
      - 'yara-x/**/*.yar'
      - 'yara-x/**/*.yarx'
      - '.github/workflows/yara-x-validate.yml'
  pull_request:
    paths:
      - 'yara-x/**/*.yar'
      - 'yara-x/**/*.yarx'
      - '.github/workflows/yara-x-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Clone and build yara-x CLI (HydraDragon fork)
        run: |
          git clone https://github.com/HydraDragonAntivirus/yara-x.git _yara-x
          cd _yara-x
          cargo build --release --bin yr
          echo "_yara-x/target/release" >> $GITHUB_PATH

      - name: Validate YARA-X rules
        run: |
          for f in $(find yara-x -name '*.yar' -o -name '*.yarx'); do
            echo "Validating: $f"
            yr check "$f" || exit 1
          done
